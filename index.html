<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Žodis — Lithuanian Practice</title>
  <style>
    /* Palette aligned with Lesson 7 (lithuanian-learner) */
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --panel: #ffffff;
      --border: #e0e4ea;
      --border-input: #ddd;
      --navy: #1a4a7a;
      --blue: #2d7dd2;
      --blue-soft: #dde8f7;
      --success: #27ae60;
      --success-bg: #d4edda;
      --success-text: #155724;
      --error: #e74c3c;
      --error-bg: #f8d7da;
      --error-text: #721c24;
      --warning: #e67e22;
      --text: #222;
      --text-dim: #666;
      --text-muted: #888;
      --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--navy);
      box-shadow: var(--card-shadow);
    }
    .hud-item { display: flex; align-items: center; gap: 0.5rem; }
    .hud-item span { color: var(--blue); }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: #e8ecf2;
      border-radius: 4px;
      margin: 0 1rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--blue));
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Mission card */
    .mission-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
      animation: cardIn 0.35s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mission-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .prompt {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1.25rem;
      word-break: break-word;
    }
    .inputs {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .field label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .field input {
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 0.65rem 0.85rem;
      background: var(--surface);
      border: 2px solid var(--border-input);
      border-radius: 10px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(45, 125, 210, 0.2);
    }
    .field input.correct {
      border-color: var(--success);
      background: #f0fff4;
    }
    .field input.wrong {
      border-color: var(--error);
      background: #fff5f5;
    }
    .field .hint-text {
      font-size: 0.8rem;
      color: var(--warning);
      font-weight: 600;
      margin-top: 0.15rem;
    }
    .field .reveal-hint {
      font-size: 0.9rem;
      color: var(--navy);
      letter-spacing: 0.06em;
      margin-top: 0.2rem;
      font-family: var(--font-mono);
    }
    .field .answer-highlight {
      font-size: 0.95rem;
      margin-top: 0.35rem;
      font-family: var(--font-mono);
      word-break: break-all;
    }
    .field .answer-highlight .wrong-char {
      color: var(--error);
      text-decoration: underline;
      text-decoration-color: var(--error);
      text-underline-offset: 2px;
    }

    /* Buttons (Lesson 7 style) */
    .btn {
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.35rem;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: none;
      margin-top: 0.5rem;
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface);
      color: var(--navy);
      border: 2px solid var(--navy);
      margin-right: 0.5rem;
    }
    .btn-secondary:hover {
      background: var(--navy);
      color: #fff;
    }

    /* Virtual keyboard */
    .vkeyboard {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
    }
    .vkeyboard-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .vkeyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .vkey {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      width: 2.35rem;
      height: 2.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: var(--navy);
      cursor: pointer;
      transition: background 0.15s;
    }
    .vkey:hover {
      background: var(--blue-soft);
    }

    /* Feedback */
    .feedback {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      animation: feedbackIn 0.3s ease;
    }
    @keyframes feedbackIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .feedback.correct {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success-text);
    }
    .feedback.wrong {
      background: var(--error-bg);
      border: 1px solid var(--error);
      color: var(--error-text);
    }

    /* Screens */
    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }
    .start-screen { text-align: center; justify-content: center; }
    .start-screen h1 {
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 2.75rem);
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      color: var(--navy);
    }
    .start-screen p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .end-screen { text-align: center; justify-content: center; }
    .end-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }
    .end-screen .score-display {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--blue);
      margin: 1rem 0;
    }
    .end-screen .perfect-msg { color: var(--success); margin-bottom: 1rem; font-weight: 600; }

    .start-actions { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; max-width: 360px; margin: 0 auto; }
    .start-actions .btn { width: 100%; margin-top: 0; }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="screen-start" class="screen start-screen active">
      <h1>ŽODIS</h1>
      <p>Choose what to practice: verb forms, Lesson 7 (family), or Lesson 8 (weather, clothes &amp; shopping).</p>
      <div class="start-actions">
        <button class="btn btn-primary" id="btn-verbs">Verb forms trainer</button>
        <a class="btn btn-secondary" href="lesson7.html" style="display:inline-block;text-align:center;text-decoration:none;line-height:1.2;padding-top:0.85rem;padding-bottom:0.85rem">Lesson 7 — Family &amp; more</a>
        <a class="btn btn-secondary" href="lesson8.html" style="display:inline-block;text-align:center;text-decoration:none;line-height:1.2;padding-top:0.85rem;padding-bottom:0.85rem">Lesson 8 — Clothes &amp; weather</a>
      </div>
    </div>

    <div id="screen-game" class="screen">
      <div class="hud">
        <div class="hud-item">Verb <span id="current-n">0</span>/<span id="verb-total">0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="hud-item">Score <span id="score">0</span></div>
      </div>
      <div class="mission-card">
        <div class="mission-label">Mission</div>
        <div class="prompt" id="prompt"></div>
        <div id="feedback" class="feedback" style="display: none;"></div>
        <div class="inputs" id="inputs"></div>
        <button class="btn btn-primary" id="btn-check">Check</button>
      </div>
      <div class="vkeyboard">
        <div class="vkeyboard-label">Lithuanian characters</div>
        <div class="vkeyboard-row" id="vkeyboard">
          <button type="button" class="vkey" data-char="ą">ą</button>
          <button type="button" class="vkey" data-char="č">č</button>
          <button type="button" class="vkey" data-char="ę">ę</button>
          <button type="button" class="vkey" data-char="ė">ė</button>
          <button type="button" class="vkey" data-char="į">į</button>
          <button type="button" class="vkey" data-char="š">š</button>
          <button type="button" class="vkey" data-char="ų">ų</button>
          <button type="button" class="vkey" data-char="ū">ū</button>
          <button type="button" class="vkey" data-char="ž">ž</button>
        </div>
      </div>
    </div>

    <div id="screen-end" class="screen end-screen">
      <h2>Mission complete</h2>
      <div class="score-display" id="final-score">0</div>
      <p class="perfect-msg" id="perfect-msg" style="display: none;">Perfect run. Confetti!</p>
      <button class="btn btn-secondary" id="btn-again">Again</button>
      <button class="btn btn-primary" id="btn-restart">New mission</button>
    </div>
  </div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <script>
    (function () {
      'use strict';

      const VERBS = [
        { inf: 'gauti', past: 'gavo', present: 'gauna', meaning: 'to get', meaningSynonyms: ['get'] },
        { inf: 'išlaikyti', past: 'išlaikė', present: 'išlaiko', meaning: 'to pass (an exam)', meaningSynonyms: ['pass', 'exam'] },
        { inf: 'neišlaikyti', past: 'neišlaikė', present: 'neišlaiko', meaning: 'to fail (an exam)', meaningSynonyms: ['fail', 'exam'] },
        { inf: 'perlaikyti', past: 'perlaikė', present: 'perlaiko', meaning: 'to retake', meaningSynonyms: ['retake'] },
        { inf: 'prasidėti', past: 'prasidėjo', present: 'prasideda', meaning: 'to begin, to start', meaningSynonyms: ['begin', 'start'] },
        { inf: 'baigtis', past: 'baigėsi', present: 'baigiasi', meaning: 'to finish, to end', meaningSynonyms: ['finish', 'end'] },
        { inf: 'mokytis', past: 'mokėsi', present: 'mokosi', meaning: 'to learn, to study', meaningSynonyms: ['learn', 'study'] },
        { inf: 'vėluoti', past: 'vėlavo', present: 'vėluoja', meaning: 'to be late', meaningSynonyms: ['late'] },
        { inf: 'skubėti', past: 'skubėjo', present: 'skubėja', meaning: 'to hurry, to rush', meaningSynonyms: ['hurry', 'rush'] },
        { inf: 'paklausti', past: 'paklausė', present: 'paklausia', meaning: 'to ask', meaningSynonyms: ['ask'] },
        { inf: 'palausti', past: 'palaukė', present: 'palaukia', meaning: 'to wait', meaningSynonyms: ['wait'] },
        { inf: 'spausdinti', past: 'spausdino', present: 'spausdina', meaning: 'to print', meaningSynonyms: ['print'] },
        { inf: 'atostogauti', past: 'atostogavo', present: 'atostogauja', meaning: 'to have vacation', meaningSynonyms: ['vacation', 'holiday'] },
        { inf: 'daryti', past: 'darė', present: 'daro', meaning: 'to do, to make', meaningSynonyms: ['do', 'make'] },
        { inf: 'keliauti', past: 'keliavo', present: 'keliauja', meaning: 'to travel', meaningSynonyms: ['travel'] },
        { inf: 'važiuoti', past: 'važiavo', present: 'važiuoja', meaning: 'to go by vehicle', meaningSynonyms: ['go', 'vehicle', 'drive', 'ride'] },
        { inf: 'atvykti', past: 'atvyko', present: 'atvyksta', meaning: 'to arrive', meaningSynonyms: ['arrive'] },
        { inf: 'išvykti', past: 'išvyko', present: 'išvyksta', meaning: 'to depart, to leave', meaningSynonyms: ['depart', 'leave'] },
        { inf: 'skristi', past: 'skrido', present: 'skrenda', meaning: 'to fly', meaningSynonyms: ['fly'] },
        { inf: 'plaukti', past: 'plaukė', present: 'plaukia', meaning: 'to swim', meaningSynonyms: ['swim'] },
        { inf: 'eiti', past: 'ėjo', present: 'eina', meaning: 'to go for a walk', meaningSynonyms: ['walk', 'go'] },
        { inf: 'grįžti', past: 'grįžo', present: 'grįžta', meaning: 'to return', meaningSynonyms: ['return', 'come back'] },
        { inf: 'mokėti', past: 'mokėjo', present: 'moka', meaning: 'to know how to do something', meaningSynonyms: ['know', 'how'] },
        { inf: 'patikti', past: 'patiko', present: 'patinka', meaning: 'to like', meaningSynonyms: ['like'] },
        { inf: 'mėgti', past: 'mėgo', present: 'mėgsta', meaning: 'to like', meaningSynonyms: ['like'] },
        { inf: 'klausyti', past: 'klausė', present: 'klauso', meaning: 'to listen', meaningSynonyms: ['listen'] },
        { inf: 'skaityti', past: 'skaitė', present: 'skaito', meaning: 'to read', meaningSynonyms: ['read'] },
        { inf: 'rašyti', past: 'rašė', present: 'rašo', meaning: 'to write', meaningSynonyms: ['write'] },
        { inf: 'miegoti', past: 'miegojo', present: 'miega', meaning: 'to sleep', meaningSynonyms: ['sleep'] },
        { inf: 'sportuoti', past: 'sportavo', present: 'sportuoja', meaning: 'to do sports', meaningSynonyms: ['sport', 'sports'] },
        { inf: 'šokti', past: 'šoko', present: 'šoka', meaning: 'to dance', meaningSynonyms: ['dance'] },
        { inf: 'dainuoti', past: 'dainavo', present: 'dainuoja', meaning: 'to sing', meaningSynonyms: ['sing'] },
        { inf: 'žaisti', past: 'žaidė', present: 'žaidžia', meaning: 'to play', meaningSynonyms: ['play'] },
        { inf: 'žiūrėti', past: 'žiūrėjo', present: 'žiūri', meaning: 'to watch, to look', meaningSynonyms: ['watch', 'look'] },
        { inf: 'bėgioti', past: 'bėgiojo', present: 'bėgioja', meaning: 'to jog', meaningSynonyms: ['jog', 'run'] },
        { inf: 'čiuožinėti', past: 'čiuožinėjo', present: 'čiuožinėja', meaning: 'to skate', meaningSynonyms: ['skate'] },
        { inf: 'plaukioti', past: 'plaukiojo', present: 'plaukioja', meaning: 'to swim (repeatedly)', meaningSynonyms: ['swim'] },
        { inf: 'žvejoti', past: 'žvejojo', present: 'žvejoja', meaning: 'to go fishing', meaningSynonyms: ['fishing', 'fish'] },
        { inf: 'slidinėti', past: 'slidinėjo', present: 'slidinėja', meaning: 'to ski', meaningSynonyms: ['ski'] },
        { inf: 'važinėti', past: 'važinėjo', present: 'važinėja', meaning: 'to ride (repeatedly)', meaningSynonyms: ['ride'] },
        { inf: 'snigti', past: 'snigo', present: 'sninga', meaning: 'to snow', meaningSynonyms: ['snow'] },
        { inf: 'dėvėti', past: 'dėvėjo', present: 'dėvi', meaning: 'to wear', meaningSynonyms: ['wear'] },
        { inf: 'avėti', past: 'avėjo', present: 'avi', meaning: 'to wear (about shoes)', meaningSynonyms: ['wear', 'shoes'] },
        { inf: 'pirkti', past: 'pirko', present: 'perka', meaning: 'to buy', meaningSynonyms: ['buy'] },
        { inf: 'nusipirkti', past: 'nusipirko', present: 'nusiperka', meaning: 'to buy (for oneself)', meaningSynonyms: ['buy'] },
        { inf: 'pasiimti', past: 'pasiėmė', present: 'pasiima', meaning: 'to take', meaningSynonyms: ['take'] },
        { inf: 'grąžinti', past: 'grąžino', present: 'grąžina', meaning: 'to return, to give back', meaningSynonyms: ['return', 'give back'] },
        { inf: 'pakeisti', past: 'pakeitė', present: 'pakeičia', meaning: 'to change', meaningSynonyms: ['change'] },
        { inf: 'parodyti', past: 'parodė', present: 'parodo', meaning: 'to show', meaningSynonyms: ['show'] },
        { inf: 'pasimatuoti', past: 'pasimatavo', present: 'pasimatuoja', meaning: 'to try on, to try something for size', meaningSynonyms: ['try on', 'try'] },
        { inf: 'reikėti', past: 'reikėjo', present: 'reikia', meaning: 'to need', meaningSynonyms: ['need'] },
        { inf: 'apsirengti', past: 'apsirengė', present: 'apsirengia', meaning: 'to dress oneself, to put on', meaningSynonyms: ['dress', 'put on'] },
        { inf: 'nusirengti', past: 'nusirengė', present: 'nusirengia', meaning: 'to undress, to take off', meaningSynonyms: ['undress', 'take off'] },
        { inf: 'tikti', past: 'tiko', present: 'tinka', meaning: 'to fit, to suit', meaningSynonyms: ['fit', 'suit'] },
        { inf: 'įdėti kortelę', past: 'įdėjo kortelę', present: 'įdeda kortelę', meaning: 'to insert a card', meaningSynonyms: ['insert', 'card'] },
        { inf: 'ištraukti kortelę', past: 'ištraukė kortelę', present: 'ištraukia kortelę', meaning: 'to remove a card', meaningSynonyms: ['remove', 'card', 'take out'] },
        { inf: 'pridėti kortelę', past: 'pridėjo kortelę', present: 'prideda kortelę', meaning: 'to touch a card to the screen', meaningSynonyms: ['tap', 'card', 'touch'] }
      ];

      const FIELDS = ['past', 'present', 'meaning'];
      const FIELD_LABELS = { past: 'Past form', present: 'Present form', meaning: 'Meaning (English)' };

      function normalize(s) {
        return (s || '').toLowerCase().trim().replace(/\s+/g, ' ');
      }

      function normalizeForMatch(s) {
        return normalize(s).replace(/^to\s+/, '');
      }

      function meaningMatches(verb, input) {
        const n = normalizeForMatch(input);
        if (n === normalizeForMatch(verb.meaning)) return true;
        return verb.meaningSynonyms.some(function (syn) {
          return n === syn || n === 'to ' + syn;
        });
      }

      function isLetter(c) {
        return c.length === 1 && /^\p{L}$/u.test(c);
      }

      function buildAnswerHighlight(userVal, correctVal) {
        if (!userVal && !correctVal) return null;
        correctVal = correctVal || '';
        userVal = userVal || '';
        var frag = document.createDocumentFragment();
        for (var i = 0; i < userVal.length; i++) {
          var isWrong = i >= correctVal.length || userVal[i] !== correctVal[i];
          if (isWrong) {
            var span = document.createElement('span');
            span.className = 'wrong-char';
            span.textContent = userVal[i];
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(userVal[i]));
          }
        }
        return frag;
      }

      function getLengthHint(word) {
        if (!word) return '';
        const letterCount = word.split('').filter(isLetter).length;
        return 'Length: ' + word.length + (letterCount !== word.length ? ' (letters: ' + letterCount + ')' : '');
      }

      function revealHint(word, mistakes) {
        if (mistakes <= 0) return null;
        const letterCount = word.split('').filter(isLetter).length;
        if (mistakes === 1) return { lengthHint: getLengthHint(word), pattern: null };
        const lettersToReveal = Math.min(mistakes - 1, letterCount);
        let revealed = 0;
        let out = '';
        for (let i = 0; i < word.length; i++) {
          if (isLetter(word[i])) {
            revealed++;
            out += revealed <= lettersToReveal ? word[i] : '_';
          } else {
            out += word[i];
          }
        }
        return { lengthHint: getLengthHint(word), pattern: out };
      }

      let state = {
        index: 0,
        score: 0,
        mistakes: { past: 0, present: 0, meaning: 0 },
        order: [],
        sessionPerfect: true
      };
      var lastFocusedInput = null;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function showScreen(id) {
        document.querySelectorAll('.screen').forEach(function (el) { el.classList.remove('active'); });
        var el = document.getElementById('screen-' + id);
        if (el) el.classList.add('active');
      }

      function getCurrentVerb() {
        return VERBS[state.order[state.index]];
      }

      function renderGame() {
        const verb = getCurrentVerb();
        const progress = state.order.length ? ((state.index + 1) / state.order.length) * 100 : 0;
        document.getElementById('current-n').textContent = state.index + 1;
        document.getElementById('verb-total').textContent = state.order.length;
        document.getElementById('score').textContent = state.score;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('prompt').textContent = 'Infinitive: ' + verb.inf;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('feedback').className = 'feedback';
        const container = document.getElementById('inputs');
        container.innerHTML = '';
        FIELDS.forEach(function (key) {
          const field = document.createElement('div');
          field.className = 'field';
          field.dataset.field = key;
          const label = document.createElement('label');
          label.textContent = FIELD_LABELS[key];
          const input = document.createElement('input');
          input.type = 'text';
          input.autocomplete = 'off';
          input.placeholder = key === 'meaning' ? 'e.g. to get' : 'Type the form';
          input.dataset.field = key;
          input.classList.remove('correct', 'wrong');
          input.addEventListener('focus', function () { lastFocusedInput = this; });
          const hintSpan = document.createElement('div');
          hintSpan.className = 'hint-text';
          hintSpan.style.display = 'none';
          const revealSpan = document.createElement('div');
          revealSpan.className = 'reveal-hint';
          revealSpan.style.display = 'none';
          const answerHighlight = document.createElement('div');
          answerHighlight.className = 'answer-highlight';
          answerHighlight.style.display = 'none';
          field.appendChild(label);
          field.appendChild(input);
          field.appendChild(hintSpan);
          field.appendChild(revealSpan);
          field.appendChild(answerHighlight);
          container.appendChild(field);
        });
        var firstInput = container.querySelector('input');
        lastFocusedInput = firstInput;
        firstInput.focus();
      }

      function runConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const colors = ['#1a4a7a', '#2d7dd2', '#27ae60', '#e67e22', '#e74c3c'];
        const pieces = [];
        for (let i = 0; i < 120; i++) {
          pieces.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            rot: Math.random() * 360
          });
        }
        let frame = 0;
        function draw() {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.rot += 4;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          });
          if (frame < 90) requestAnimationFrame(draw);
          else canvas.style.display = 'none';
        }
        canvas.style.display = 'block';
        draw();
      }

      function checkAnswer() {
        const verb = getCurrentVerb();
        const inputs = document.querySelectorAll('#inputs input');
        let allCorrect = true;
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.style.display = 'block';
        inputs.forEach(function (input) {
          const key = input.dataset.field;
          const val = normalize(input.value);
          const fieldDiv = input.closest('.field');
          const hintSpan = fieldDiv.querySelector('.hint-text');
          const revealSpan = fieldDiv.querySelector('.reveal-hint');
          const answerHighlight = fieldDiv.querySelector('.answer-highlight');
          hintSpan.style.display = 'none';
          revealSpan.style.display = 'none';
          answerHighlight.style.display = 'none';
          answerHighlight.innerHTML = '';
          input.classList.remove('correct', 'wrong');
          let correct = false;
          if (key === 'meaning') {
            correct = meaningMatches(verb, val);
          } else {
            var correctForm = verb[key];
            correct = val === normalize(correctForm);
          }
          if (correct) {
            input.classList.add('correct');
            state.score += 10;
          } else {
            allCorrect = false;
            state.sessionPerfect = false;
            state.mistakes[key]++;
            input.classList.add('wrong');
            const target = key === 'meaning' ? verb.meaning : verb[key];
            const correctNorm = normalize(target);
            const highlightFrag = buildAnswerHighlight(val, correctNorm);
            if (highlightFrag && answerHighlight) {
              answerHighlight.appendChild(highlightFrag);
              answerHighlight.style.display = 'block';
            }
            const hint = revealHint(target, state.mistakes[key]);
            if (hint) {
              hintSpan.textContent = hint.lengthHint;
              hintSpan.style.display = 'block';
              if (hint.pattern) {
                revealSpan.textContent = hint.pattern;
                revealSpan.style.display = 'block';
              }
            }
          }
        });
        if (allCorrect) {
          feedbackEl.textContent = 'Correct. Well done!';
          feedbackEl.className = 'feedback correct';
          state.index++;
          if (state.index >= state.order.length) {
            document.getElementById('final-score').textContent = state.score;
            if (state.sessionPerfect) {
              document.getElementById('perfect-msg').style.display = 'block';
              document.getElementById('perfect-msg').textContent = 'Perfect run. Confetti!';
              runConfetti();
            } else {
              document.getElementById('perfect-msg').style.display = 'none';
            }
            showScreen('end');
          } else {
            state.mistakes = { past: 0, present: 0, meaning: 0 };
            setTimeout(function () {
              renderGame();
            }, 600);
          }
        } else {
          feedbackEl.textContent = 'Some answers are wrong. Use the hints below or try again.';
          feedbackEl.className = 'feedback wrong';
        }
      }

      document.getElementById('btn-verbs').addEventListener('click', function () {
        state.index = 0;
        state.score = 0;
        state.mistakes = { past: 0, present: 0, meaning: 0 };
        state.order = shuffle(VERBS.map(function (_, i) { return i; }));
        state.sessionPerfect = true;
        state.order = state.order.map(function (i) { return i; });
        showScreen('game');
        renderGame();
      });

      document.getElementById('btn-check').addEventListener('click', checkAnswer);
      document.getElementById('inputs').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkAnswer();
        }
      });

      document.getElementById('vkeyboard').addEventListener('click', function (e) {
        const key = e.target.closest('.vkey');
        if (!key) return;
        e.preventDefault();
        var input = lastFocusedInput;
        if (!input || !document.contains(input)) {
          input = document.querySelector('#inputs input');
          if (input) lastFocusedInput = input;
        }
        if (input && input.matches && input.matches('input[data-field]')) {
          var start = input.selectionStart;
          var end = input.selectionEnd;
          var text = input.value;
          input.value = text.slice(0, start) + key.dataset.char + text.slice(end);
          input.selectionStart = input.selectionEnd = start + 1;
          input.focus();
        }
      });

      document.getElementById('btn-again').addEventListener('click', function () {
        state.index = 0;
        state.score = 0;
        state.mistakes = { past: 0, present: 0, meaning: 0 };
        showScreen('game');
        renderGame();
      });

      document.getElementById('btn-restart').addEventListener('click', function () {
        showScreen('start');
      });
    })();
  </script>
</body>
</html>
